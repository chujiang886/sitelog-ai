<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>恢复旧页面 AI · 施格归档</title>
<style>body{font:18px/1.8 system-ui;background:#f5f7fa;color:#173e2b;max-width:720px;margin:70px auto;padding:24px}a{color:inherit}.button{display:inline-block;background:#173e2b;color:white;padding:12px 24px;border-radius:10px;text-decoration:none}li{margin:16px 0}</style>
<h1>保留照片，恢复旧页面 AI</h1><p>适用于仍打开 v5.0.0、已有照片和人工审核文字的工程页面。无需刷新或退出登录。</p>
<ol><li>按 <b>Ctrl + Shift + B</b> 显示浏览器书签栏。</li><li>将下方绿色按钮<b>拖到书签栏</b>。</li><li>回到原来的工程页面，点击刚保存的书签，再点击「AI 一键整理」。</li></ol>
<a class="button" href="javascript:(()=>{if(!['cj-az.cn','www.cj-az.cn'].includes(location.hostname)||!location.pathname.startsWith('/sitelog')){alert('请先回到原有工程归档页面，再点击此书签。');return;}const s=document.createElement('script');s.src='/sitelog/hotfix-ai.js?t='+Date.now();s.onerror=()=>alert('恢复文件暂时无法读取，请保留当前页面稍后重试。');document.head.appendChild(s);})()">恢复 AI，保留当前工程</a>
<p>这个书签只更新当前工程页的 AI 功能，不会清空照片、覆盖审核文字或改变账号。</p><p>尚未开始整理的新工程，可直接<a href="/sitelog/">打开新版归档系统</a>。</p></html>
