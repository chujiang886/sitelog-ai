# BOIP Agent 路由与运行时配置（Phase 0 占位）
#
# 本文件由 agents/loader.py 读取，描述：
# - 哪些 Agent 被注册（name → fully-qualified class path）
# - Agent 框架全局开关（LLM、超时、重试、并发）
#
# 任何工程数值仍保持 pending_verification；Phase 2 已接入真实 LLM（providers.text/vision=腾讯混元 TokenHub 多模态）。

version: "0.1.0-phase0"
description: "Phase 0 Agent 框架配置；不连接任何外部 LLM 或服务。"

agents:
  core:
    class_path: agents.core.agent.CoreAgent
    enabled: true
    stage: orchestrator
  environment:
    class_path: agents.environment.agent.EnvironmentAgent
    enabled: true
    stage: context
  vision:
    class_path: agents.vision.agent.VisionAgent
    enabled: true
    stage: context
  design:
    class_path: agents.design.agent.DesignAgent
    enabled: true
    stage: candidate
  engineering:
    class_path: agents.engineering.agent.EngineeringAgent
    enabled: false  # 2.1.5 骨架已建立（结构/契约/审核链）；进编排管道待 TD-005 偿还评审后启用
    stage: engineering

# 全局开关（遗留键，已弃用，见下方 llm.* 段）
llm_enabled: false  # 弃用：仅兼容遗留 loader 校验，真实开关见 llm.enabled
llm_provider: ""    # 弃用：provider 事实源已迁移到 llm.providers.{text,vision,fallback}

# Phase 2 命名式 provider 注册表（LLM 配置）
#
# text / vision 主轨：腾讯混元 TokenHub `HY-Vision-2.0-Instruct`
#   （openai_compat，多模态 text+vision 共享）；
#   演进路径 DashScope qwen-max（T07, 401 失败）→ minimax（临时）→ TokenHub（Phase 2 采用）。
# fallback：mock 容灾兜底（不接真实网络）；真实 key 在 .env（不入 git），本文件不含具体 key。
# embedding：向量/检索预留（provider=disabled，无消费者；Phase 3 知识库/RAG 再接入）。
# 视觉/文本 provider 解耦见 2.1.6（providers 注册表 + build_router_from_config(role=...)）。
# 注：router.py 仍保留对旧 track_a/track_b 键的兼容解析，但本文件不再使用它们作为配置入口。
llm:
  enabled: true  # Phase 2 已接 TokenHub 真实多模态；由 DualTrackRouter 选路
  # ── 命名式 provider 注册表（2.1.6 provider 解耦，新配置唯一入口）──
  providers:
    text:                        # 文本推理主轨（与旧 track_a 同源）
      provider: openai_compat
      base_url: ${LLM_A_BASE_URL:pending_verification}
      api_key: ${LLM_A_API_KEY:pending_verification}
      model: ${LLM_A_MODEL:pending_verification}
    vision:                      # 视觉推理主轨（多模态；当前与 text 同源）
      provider: openai_compat
      base_url: ${LLM_A_BASE_URL:pending_verification}
      api_key: ${LLM_A_API_KEY:pending_verification}
      model: ${LLM_A_MODEL:pending_verification}
    embedding:                   # 向量/检索预留（暂不启用）
      provider: disabled         # disabled → build_embedding_provider 返回 None
    fallback:                    # 容灾副轨（文本/视觉共用）
      provider: mock             # 不接真实网络；真实 key 在 .env（不入 git）
  router:
    strategy: fastest  # 选型评测由 TD-013 跟踪
    timeout: 30

# Environment 真实数据接入（Phase 2.2 / 2.2.1，ADR-2.2.1）
#
# 三模式：disabled（默认，Agent 走 LLM 推理路径，零行为变化）｜ mock（CI/测试，
# 零外网）｜ <真实源名>（ADR-02 厂商批准后经 register_*_provider 注册接入）。
# api_key 仅为环境变量占位（缺省回落 pending_verification），本文件不含任何真实密钥。
environment_data:
  geo:
    provider: disabled           # disabled | mock | <ADR-02 批准后的真实源名>
    api_key: ${ENV_GEO_API_KEY:pending_verification}
    timeout_seconds: 8           # infrastructure-config
  weather:
    provider: disabled           # disabled | mock | <ADR-02 批准后的真实源名>
    api_key: ${ENV_WEATHER_API_KEY:pending_verification}
    timeout_seconds: 8           # infrastructure-config
  solar:
    provider: local              # 策略锁定：本地天文算法（实现挂起至 2.2.1 Step 2，见 ADR §6）
  cache:
    backend: sqlite              # 实现随真实 Provider 同批（ADR §8）
    ttl_days: 30                 # infrastructure-config

# 占位超参数；Phase 1+ 由主理人评审后填实数
runtime:
  invoke_timeout_seconds: 30      # pending_verification
  invoke_retries: 1              # pending_verification
  max_concurrent_invocations: 4  # pending_verification

# 编排管道：与 agents/core/orchestrator.py 的 DEFAULT_PIPELINE 保持一致
orchestrator:
  pipeline:
    - environment
    - vision
    - design
  # 第四步 engineering 留待 TD-005 偿还时再启用
  engineering_enabled: false

# ═══════════════════════════════════════════════════════════════════════════
# Phase 3.9.9 — Real Staging Runtime Integration & Validation Layer（Task 4）
# ═══════════════════════════════════════════════════════════════════════════
# 本地预生产（Local Staging）环境描述。本段只描述「非生产」预生产环境的接入形状，
# 不承载任何生产资源：所有 resource 值经 ${VAR:pending_verification} 占位、由环境
# 变量注入；缺省回落 pending_verification（即「未提供真实外部 Staging 资源」），
# 系统据此标记 PENDING_EXTERNAL_STAGING_RESOURCE 后，继续完成 Local Staging 等
# 可独立验证的工程。五类资源（database/secret/identity_provider/storage/alert）
# 经 EnvironmentIsolationGuard 结构性校验，永不指向生产等效资源。
#
# 红线：本段 environment 取值只能是 local_staging | external_staging，永远不是
# production；forbidden_production_fingerprints 为生产指纹黑名单占位（收口时由治理
# 注入真实生产指纹；此处保持空，不内联任何真实生产值）。
staging:
  environment: local_staging        # local_staging | external_staging（绝不 production）
  purpose: "Real non-production pre-prod runtime integration & validation (Phase 3.9.9)"
  resources:
    # 非生产 DSN；经隔离校验不得等于生产 DSN（fail-closed）
    database: ${STAGING_DB_DSN:pending_verification}
    # 非生产 Secret 引用；经隔离校验不得等于生产 Secret
    secret: ${STAGING_SECRET_REF:pending_verification}
    # 非生产 IdP issuer；经隔离校验不得等于生产 IdP
    identity_provider: ${STAGING_IDP_ISSUER:pending_verification}
    # 非生产存储桶；经隔离校验不得等于生产存储
    storage: ${STAGING_STORAGE_BUCKET:pending_verification}
    # 非生产告警通道；经隔离校验不得等于生产告警
    alert: ${STAGING_ALERT_CHANNEL:pending_verification}
  # 生产等效指纹黑名单（占位空，不写真实生产值；收口时由治理注入）
  forbidden_production_fingerprints: []