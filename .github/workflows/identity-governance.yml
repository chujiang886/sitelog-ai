name: Identity, Governance & Production Security Gate

# Phase 3.8.28 T6 建立（身份链路）；**Phase 3.8.29 T5 扩为生产安全门禁**。
#
# 与通用 CI（ci.yml / local_ci.sh）互补：通用 CI 保证"整体没坏"，本流水线只盯
# 最高风险面 —— 身份、凭据、权限、生产配置 —— 跑得更窄、更快、更不可跳过。
#
#   1. identity-static-scan        遗留身份头 x-actor-* 的信任回归；
#   2. production-security-scan    生产安全七条红线（Cookie 出口 / 凭据不落 JS /
#                                  CORS 通配 / 关闭验签 / 测试密钥 /
#                                  engineering_enabled / static-dev 缺省）；
#   3. backend-identity-tests      身份安全 6 类 fail-closed + 头伪造回归；
#   4. backend-production-security 生产安全 7 类 fail-closed（含扫描器自检）；
#   5. governance-permission-tests 治理权限与问责链路（默认拒绝）；
#   6. dependency-audit            依赖已知漏洞扫描（后端 pip / 前端 npm）；
#   7. frontend-identity-tests     前端身份链路（Cookie 模式缺省、CSRF 回填）。
#
# 任一 job 失败即整条流水线失败（fail-closed），不允许"先合并再修"。
#
# 关于依赖扫描的严格度：pip-audit / npm audit 命中即失败，**不设 continue-on-error**。
# 理由是这条流水线覆盖的是身份与凭据链路，一个可利用的传递依赖漏洞足以让上面
# 六条全部失效。噪音由"提升最低受影响版本"来治，而不是靠把门禁调软。

on:
  pull_request:
  push:
    branches:
      - "feat/phase3.8.29-production-security"
      - "main"

permissions:
  contents: read

concurrency:
  group: boip-identity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  identity-static-scan:
    name: Legacy identity-header static scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan for x-actor-* trust regression
        run: python scripts/lint/check_legacy_identity_headers.py --root .

  production-security-scan:
    name: Production security red-line scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 纯标准库实现，无需安装依赖 —— 门禁本身不应依赖装包成功。
      - name: Scan production security red lines
        run: python scripts/lint/check_production_security.py --root .

  backend-identity-tests:
    name: Backend identity security tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --requirement backend/requirements.txt
      - name: Run governance identity security suite
        working-directory: backend
        env:
          JWT_SECRET: test-jwt-secret-not-for-production
        run: python -m pytest tests/test_governance_identity_security.py -q

  backend-production-security:
    name: Backend production security tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --requirement backend/requirements.txt
      - name: Run production security suite
        working-directory: backend
        env:
          JWT_SECRET: test-jwt-secret-not-for-production
        run: python -m pytest tests/test_production_security.py -q

  governance-permission-tests:
    name: Governance permission & accountability tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --requirement backend/requirements.txt
      - name: Run RBAC / accountability suites
        working-directory: backend
        env:
          JWT_SECRET: test-jwt-secret-not-for-production
        run: python -m pytest tests/test_rbac.py tests/test_governance_accountability.py tests/test_ci_scanners.py -q

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit backend dependencies
        run: python -m pip_audit --requirement backend/requirements.txt --strict
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Audit frontend dependencies (high severity and above)
        run: npm audit --audit-level=high

  frontend-identity-tests:
    name: Frontend identity link tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run identity link tests
        working-directory: frontend
        run: npx jest --config jest.config.js src/lib/identity --runInBand
