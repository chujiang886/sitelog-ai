name: Identity & Governance Security Gate

# Phase 3.8.28 T6 —— 企业身份认证与权限治理专项 CI。
#
# 与通用 CI（ci.yml / local_ci.sh）互补：聚焦"身份链路"这一最高风险面，
# 在每次 PR 上独立跑一套更窄、更快、更不可跳过的检查：
#   1. 静态扫描：禁止遗留身份头 x-actor-id / x-actor-kind 的信任回归；
#   2. 后端安全测试：6 类 fail-closed + 头伪造回归 + 前后端词表对齐；
#   3. 前端身份链路测试：BackendSession 适配层、token-store、registry 缺省、
#      禁语红线、无默认责任人。
#
# 任一阶段失败即整条流水线失败（fail-closed），不允许"先合并再修"。

on:
  pull_request:
  push:
    branches: ["feat/phase3.8.28-enterprise-identity", "main"]

permissions:
  contents: read

concurrency:
  group: boip-identity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  identity-static-scan:
    name: Legacy identity-header static scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan for x-actor-* trust regression
        run: python scripts/lint/check_legacy_identity_headers.py --root .

  backend-identity-tests:
    name: Backend identity security tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --requirement backend/requirements.txt
      - name: Run governance identity security suite
        working-directory: backend
        env:
          JWT_SECRET: test-jwt-secret-not-for-production
        run: python -m pytest tests/test_governance_identity_security.py -q

  frontend-identity-tests:
    name: Frontend identity link tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run identity link tests
        working-directory: frontend
        run: npx jest --config jest.config.js src/lib/identity --runInBand
