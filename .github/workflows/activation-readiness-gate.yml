name: Production Activation Evidence Readiness Gate

# Phase 3.9.6 T23 —— 生产激活证据准备层 CI 门禁（只读，fail-closed）。
#
# 与通用 CI（ci.yml）、身份/生产安全门禁（identity-governance.yml）、
# 发布闸门（release-gate.yml）、遥测质量门禁（telemetry-quality-gate.yml）互补：
# 本流水线只盯"生产激活就绪证据是否已齐备、受控激活闸门是否未 BLOCKED、四角色人工
# 签署结构是否就位"。它**不激活、不部署、不宣布 GO** —— 即便全绿，也只代表候选处于
# PRODUCTION_ACTIVATION_EVIDENCE_READY_BUILT_NO_GO / READY_FOR_HUMAN_REVIEW /
# READY_FOR_HUMAN_SIGNOFF，等待真实人工（production-owner / release-manager /
# security-owner / auditor）线下提交真实证据并裁决。
#
#   activation-readiness-integrity   治理仓库完整性 9/9（只读基线核对）；
#   activation-readiness-security    生产安全 lint（7/7）+ 审计账本校验 + 硬编码扫描（0 命中）；
#   activation-readiness-tests       生产激活就绪层单元 / 契约 / fail-closed 测试
#                                   （含 3.9.2 发布闸门 / RC 冻结回归，确保未破坏既有契约）。
#
# 任一 job 失败即整条流水线失败（fail-closed）。
#
# ── 分支覆盖策略（Phase 3.9.6 T23，2026-08-13）──────────────────────────────────
# 激活就绪门禁必须对**真实的 3.9.6 集成载体**生效，且能自动覆盖后续治理层增量。
# 因此这里同时声明：
#   1) main —— 长期主干（占位保留，防止未来落主干后漏跑）；
#   2) 真实 3.9.6 集成载体（显式列出，可读、可审计）；
#   3) 后续 release integration / 治理层分支通配（feat/phase3.9.* /
#      feat/phase*-release-* / release/**），保证下一个阶段新建集成分支时门禁自动生效、
#      无需再改 CI；
#   4) 历史发布闸门分支（保留，不破坏既有 CI 契约）。
# pull_request 触发保持"无分支过滤"= 覆盖所有目标分支的 PR，属最严格配置，勿收窄。

on:
  pull_request:
  push:
    branches:
      # 1) 长期主干（占位保留）
      - "main"
      # 2) 真实 3.9.6 集成载体（显式）
      - "feat/phase3.9.6-production-activation-evidence-readiness"
      # 3) 后续 release integration / 治理层分支策略（通配，自动覆盖新建集成分支）
      - "feat/phase3.9.*"
      - "feat/phase*-release-*"
      - "release/**"
      # 4) 历史发布闸门分支（保留，不破坏既有 CI）
      - "feat/phase3.9.2-production-release-gate"

permissions:
  contents: read

concurrency:
  group: boip-activation-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  activation-readiness-integrity:
    name: Governance repository integrity (9/9)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ensure pyyaml (audit.py enum import transitively requires it)
        run: python -m pip install --quiet pyyaml
      # 校验器需导入仓库内 agents/enterprise/audit.py 的 AuditActionCategory，
      # 而 audit.py 依赖 yaml，故 CI 需先安装 pyyaml（非纯标准库）。
      - name: Run governance repository integrity checker
        run: python scripts/check_governance_repository_integrity.py --root .

  activation-readiness-security:
    name: Production security lint & audit ledger
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ensure pyyaml (audit ledger validator imports audit.py -> yaml)
        run: python -m pip install --quiet pyyaml
      # 生产安全七红线静态扫描（fail-closed）。
      - name: Production security lint (7/7)
        run: python scripts/lint/check_production_security.py
      # 审计账本一致性校验（新增 ACTIVATION_* 四类审计事件须已落账本）。
      - name: Audit category ledger validator
        run: python scripts/audit_category_ledger_validator.py
      # 业务硬编码 / 臆造数据扫描（0 命中）。
      - name: Hard-coded business config scan
        run: python scripts/lint/check_hardcoded.py

  activation-readiness-tests:
    name: Production activation readiness tests (fail-closed)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --requirement backend/requirements.txt
      # 核心：3.9.6 生产激活就绪层契约 + 3.9.2 发布闸门 / RC 冻结回归（不得破坏既有契约）。
      - name: Run production activation readiness + release gate regression suites
        run: >-
          python -m pytest
          tests/agents/test_production_activation_readiness.py
          tests/agents/test_enterprise_production_release.py
          tests/agents/test_enterprise_rc_freeze_activation_gate.py
          -q

  activation-readiness-evidence-packet:
    name: Evidence packet & API contract (generate → validate → diff)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 包生成器依赖 agents 企业包（audit.py → yaml）。
      - name: Ensure pyyaml
        run: python -m pip install --quiet pyyaml
      # 1) 重新生成机器可读复核包（schema 2.0.0，含 Layer A+B，确定性 source_commit）。
      - name: Generate production activation review packet
        run: python scripts/generate_production_activation_review_packet.py
      # 2) 校验包（schema / 终端态 / 红线 / 篡改哈希 / Layer B / B1-B6·PV1-PV6 1:1）。
      - name: Validate production activation review packet
        run: python scripts/validate_production_activation_review_packet.py
      # 3) 包必须与已提交副本一致——代码变更必须先重新生成并提交（新鲜度 + 一致性）。
      - name: Packet must match committed copy
        run: git diff --exit-code .ai/release-gate/production_activation_review_packet.json
      # 4) 重新生成 API 契约快照（15 路由，Layer A+B，确定性）。
      - name: Generate production activation API contract snapshot
        run: python scripts/generate_production_activation_api_contract.py
      # 5) 契约必须与已提交副本一致——路由增删/方法/权限变更必须显式对账（漂移检测）。
      - name: API contract must match committed copy
        run: git diff --exit-code .ai/baselines/production_activation_api_contract.json
