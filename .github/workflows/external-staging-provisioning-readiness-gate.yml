name: External Staging Provisioning Readiness Gate

# Phase 3.9.12 —— 外部预生产供给算子就绪层 CI 门禁（fail-closed）。
#
# 与通用 CI（ci.yml）、执行资格门禁（external-staging-execution-qualification-gate.yml）、
# 资格认定门禁（external-staging-qualification-gate.yml）等互补。本流水线只盯
# "External Staging Provisioning 层是否 safe-closed、可证明非生产、不吸收旧 WIP、
# 不引入新企业审计类目"：
#
#   branch-integrity-gate        Branch Integrity Guard（错分支 / forbidden 模块 / 3.9.13 / 审计漂移）
#   provisioning-tests           External Staging Provisioning 测试矩阵（fail-closed）
#   package-generate-validate    确定性供给算子包 generate + validate（SHA-256 稳定 / fail-closed）
#   audit-ledger-baseline        AuditActionCategory Ledger 校验（total 必须 = 129，0 新增企业类目）
#   api-contract-validate        7 routes API 契约基线校验（机器可读契约不漂移）
#   credential-safety            credential_scanner 红线（包内不得含真实密钥）
#   iac-dry-run-gate            IaC 干跑校验（无明文 / count=0 占位 / 默认 provider 合规）
#   repo-clean                   收口后工作树仅含合法交付物（无 forbidden / 无 3.9.13）
#
# 任一 job 失败即整条流水线失败（fail-closed）。本门禁**不激活、不部署、不翻转
# engineering_enabled、不写真实控制平面、不吸收 Production Handoff WIP**——全绿仅代表供给
# 算子就绪层安全合规，真实 External Staging 资源供给与 GO 仍需主理人在人类终端、四角色
# 真实签署后显式执行。

on:
  pull_request:
  push:
    branches:
      - "main"
      - "feat/phase3.9.12-external-staging-provisioning-operator-readiness"
      - "feat/phase3.9.*"
      - "feat/phase*-release-*"
      - "release/**"

permissions:
  contents: read

concurrency:
  group: boip-external-staging-provisioning-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  branch-integrity-gate:
    name: Branch Integrity Guard (fail-closed)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ensure pyyaml
        run: python -m pip install --quiet pyyaml
      - name: Run Branch Integrity Gate
        run: python scripts/check_phase3912_branch_integrity.py

  provisioning-tests:
    name: External Staging Provisioning tests (fail-closed)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --quiet --requirement backend/requirements.txt
      - name: Run staging provisioning test matrix
        run: >-
          python -m pytest
          tests/agents/test_external_staging_provisioning.py
          tests/agents/test_external_staging_provisioning_services.py
          backend/tests/test_api_external_staging_provisioning.py
          -q

  package-generate-validate:
    name: Deterministic provisioning package (generate + validate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --quiet --requirement backend/requirements.txt
      - name: Regenerate package (deterministic) and validate
        run: |
          python scripts/generate_external_staging_provisioning_package.py
          python scripts/validate_external_staging_provisioning.py .ai/staging/external_staging_provisioning_operator_package.json

  audit-ledger-baseline:
    name: Audit Ledger baseline (total == 129)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ensure pyyaml
        run: python -m pip install --quiet pyyaml
      - name: Validate Audit Action Category Ledger
        run: python scripts/audit_category_ledger_validator.py

  api-contract-validate:
    name: API contract baseline (7 routes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate external staging provisioning API contract baseline
        run: python -c "import json,sys; from agents.external_staging_provisioning import build_api_contract; d=build_api_contract(); assert d.get('total_routes')==7, 'expected 7 routes'; assert d.get('no_execution_endpoint') is True, 'no_execution_endpoint must be True'; assert set(d.get('operator_gate_states'))=={'blocked','pending_human_input','ready_for_human_provisioning_review'}; assert d.get('forbidden_provisioning_modes')==['auto','production']; print('[PASS] external staging provisioning API contract: 7 routes, no execution endpoint, 3-state operator gate')"

  credential-safety:
    name: Credential safety scan (no real secret in package)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --quiet --requirement backend/requirements.txt
      - name: Assert package contains no real secret
        run: python -c "import json; d=json.load(open('.ai/staging/external_staging_provisioning_operator_package.json')); assert d.get('contains_real_secret') is False, 'contains_real_secret must be False'; assert d.get('production_activation_prohibited') is True, 'production_activation_prohibited must be True'; print('[PASS] package credential safety: no real secret, activation prohibited')"

  iac-dry-run-gate:
    name: IaC dry-run guard (no real provisioning / no secret)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --quiet --requirement backend/requirements.txt
      - name: Run IaC Dry-run Guard
        run: >-
          python -c
          "from agents.external_staging_provisioning.dry_run_guard import IacDryRunGuard;
          r = IacDryRunGuard().evaluate();
          assert r.all_ok, 'IaC dry-run failed: ' + str(r.to_dict());
          print('[PASS] IaC dry-run: no credential leak, count=0 placeholders, default provider=tencentcloud')"

  repo-clean:
    name: Repo clean (no forbidden / no 3.9.13)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan for forbidden / next-phase carryover
        run: |
          python - <<'PY'
          import subprocess, sys, os
          rc, out = subprocess.run(["git","ls-files"], capture_output=True, text=True).returncode, subprocess.run(["git","ls-files"], capture_output=True, text=True).stdout
          files = out.splitlines()
          bad = [f for f in files if ("production_handoff" in f.lower() or "handoff" in f.lower() or "3.9.13" in f)]
          if bad:
              print("FORBIDDEN FILES:", bad); sys.exit(1)
          print("[PASS] repo clean: no forbidden module / no 3.9.13 carryover")
          PY
