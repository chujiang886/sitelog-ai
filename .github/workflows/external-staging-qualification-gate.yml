name: External Staging Qualification Gate

# Phase 3.9.10 —— 外部预生产资格认定与证据集成层 CI 门禁（fail-closed）。
#
# 与通用 CI（ci.yml）、激活就绪门禁（activation-readiness-gate.yml）、生产激活模拟门禁
# （production-activation-simulation-gate.yml）、身份/生产安全门禁（identity-governance.yml）、
# 发布闸门（release-gate.yml）、遥测质量门禁（telemetry-quality-gate.yml）互补。本流水线只盯
# "External Staging Qualification 层是否 safe-closed、可证明非生产、不吸收旧 WIP、不引入新审计类目"：
#
#   branch-integrity-gate        Branch Integrity Guard（错分支 / forbidden 模块 / 3.9.11 / 审计漂移）
#   staging-qualification-tests  External Staging Qualification 50 fail-closed 测试矩阵
#   package-generate-validate    确定性资格包 generate + validate（SHA-256 稳定 / fail-closed）
#   audit-ledger-baseline        AuditActionCategory Ledger 校验（total 必须 = 129，0 新增）
#   api-contract-validate        8 routes API 契约基线校验（机器可读契约不漂移）
#   credential-safety            credential_scanner 红线（包内不得含真实密钥）
#   isolation-check              isolation / denylist 结构证明 Staging ≠ Production
#   repo-clean                   收口后工作树仅含合法交付物（无 forbidden / 无 3.9.11）
#
# 任一 job 失败即整条流水线失败（fail-closed）。本门禁**不激活、不部署、不翻转
# engineering_enabled、不写真实控制平面、不吸收 Production Handoff WIP**——全绿仅代表资格认定层
# 安全合规，真实 External Staging 资源登记与 GO 仍需主理人在人类终端、四角色真实签署后显式执行。

on:
  pull_request:
  push:
    branches:
      - "main"
      - "feat/phase3.9.10-external-staging-qualification"
      - "feat/phase3.9.*"
      - "feat/phase*-release-*"
      - "release/**"

permissions:
  contents: read

concurrency:
  group: boip-external-staging-qualification-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  branch-integrity-gate:
    name: Branch Integrity Guard (fail-closed)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ensure pyyaml
        run: python -m pip install --quiet pyyaml
      - name: Run Branch Integrity Gate
        run: python scripts/check_phase39x_branch_integrity.py

  staging-qualification-tests:
    name: External Staging Qualification tests (50 fail-closed)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --quiet --requirement backend/requirements.txt
      - name: Run staging qualification test matrix
        run: >-
          python -m pytest
          tests/agents/test_external_staging_qualification.py
          -q

  package-generate-validate:
    name: Deterministic qualification package (generate + validate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --quiet --requirement backend/requirements.txt
      - name: Regenerate package (deterministic) and validate
        run: |
          python scripts/generate_external_staging_qualification_package.py --source-commit "$(git rev-parse HEAD)"
          python scripts/validate_external_staging_qualification_package.py .ai/staging/external_staging_qualification_package.json

  audit-ledger-baseline:
    name: Audit Ledger baseline (total == 129)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ensure pyyaml
        run: python -m pip install --quiet pyyaml
      - name: Validate Audit Action Category Ledger
        run: python scripts/audit_category_ledger_validator.py

  api-contract-validate:
    name: API contract baseline (8 routes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate external staging API contract baseline
        run: python -c "import json,sys; d=json.load(open('.ai/baselines/external_staging_api_contract.json')); assert d.get('total_routes', len(d.get('routes', []))) == 8, 'expected 8 routes'; print('[PASS] external staging API contract: 8 routes')"

  credential-safety:
    name: Credential safety scan (no real secret in package)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --quiet --requirement backend/requirements.txt
      - name: Assert package contains no real secret
        run: python -c "import json; d=json.load(open('.ai/staging/external_staging_qualification_package.json')); assert d.get('contains_real_secret') is False, 'contains_real_secret must be False'; assert d.get('production_activation_prohibited') is True, 'production_activation_prohibited must be True'; print('[PASS] package credential safety: no real secret, activation prohibited')"

  isolation-check:
    name: Staging isolation / denylist (Staging != Production)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --quiet --requirement backend/requirements.txt
      - name: Import isolation + denylist (structure proof loads)
        run: >-
          python -c
          "from agents.external_staging_qualification import ExternalStagingEnvironmentIdentity, ProductionReferenceDenylist, DEFAULT_PRODUCTION_DENYLIST, RuntimeHealthStatus; print('[PASS] isolation/denylist modules importable')"

  repo-clean:
    name: Repo clean check (no forbidden / no 3.9.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ensure pyyaml
        run: python -m pip install --quiet pyyaml
      - name: Re-run Branch Integrity Gate as final clean assertion
        run: python scripts/check_phase39x_branch_integrity.py
