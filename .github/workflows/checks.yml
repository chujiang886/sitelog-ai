name: 前端构建与单元回归
on: [push, pull_request]
permissions:
  # write 只用于 CI 失败时把失败详情贴成 commit 评论：Actions 日志下载需要认证，
  # 而 commit 评论未认证可读，排障不必去翻日志。
  contents: write
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      # 本机通常全绿、CI 偶红时，日志下载需要认证，排障很慢。把失败详情写进
      # job summary（run 页面公开可读），不用下载日志也能看到是哪条挂了。
      - name: 输出测试失败详情
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo '### npm test 失败详情'
            echo '```'
            npm test 2>&1 | grep -vE '^\s*✔' | tail -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          npm test > /tmp/npm-test.log 2>&1 || true
          python3 - > /tmp/body.json <<'PY'
          import json
          log = open('/tmp/npm-test.log', encoding='utf-8', errors='replace').read()
          keep = [l for l in log.splitlines() if not l.strip().startswith(('✔', 'ok '))]
          body = '### 前端 CI：npm test 失败\n\n```\n' + '\n'.join(keep[-60:]) + '\n```'
          print(json.dumps({'body': body[:60000]}))
          PY
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/chujiang886/sitelog-ai/commits/$SHA/comments" \
            -d @/tmp/body.json
      - run: npm run build
