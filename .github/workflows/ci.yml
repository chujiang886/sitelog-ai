name: BOIP CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: boip-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-ci:
    name: Full local CI parity gate
    runs-on: ubuntu-latest
    timeout-minutes: 20 # infrastructure-config
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --requirement backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run the eight-step CI pipeline
        run: bash scripts/ci/local_ci.sh
