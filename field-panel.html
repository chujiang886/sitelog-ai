<div x-show="fieldPanel" x-cloak role="dialog" aria-label="现场助手" class="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4"><div class="bg-white rounded-xl p-6 w-full max-w-4xl max-h-[90vh] overflow-auto">
<div class="flex justify-between"><h2 class="text-xl font-bold">现场助手</h2><button @click="fieldPanel=false" aria-label="关闭现场助手" class="text-2xl">×</button></div>
<p class="text-sm text-slate-500 my-3">清单用于拍摄留底与补录，不代表安装质量合格。没有现场证据的尺寸、材料和验收结论应留待核实。</p>
<h3 class="font-bold">拍摄清单</h3><p class="text-amber-800" x-text="'尚有 '+fieldMissing()+' 项未关联留底照片'"></p>
<template x-for="item in checklistItems()" :key="item.key"><label class="flex gap-3 items-center my-2"><span x-text="(checkField(item)?'已留底：':'待补拍：')+item.label"></span><select x-model="fieldChecks[item.key]" @change="markDraftDirty()" class="border rounded p-2"><option value="">选择对应照片</option><template x-for="photo in $data[item.group]" :key="photo.id"><option :value="photo.id" x-text="photo.title||photo.filename||'照片'"></option></template></select></label></template>
<h3 class="font-bold mt-5">现场事实补录</h3><label class="block my-2">实测数据与测量依据<textarea x-model="fieldFacts.measurements" @input="markDraftDirty()" maxlength="1500" class="border rounded p-2 w-full" placeholder="只填写已实际测量的数据，并说明位置、工具和测量人"></textarea></label><label class="block my-2">材料信息与来源<textarea x-model="fieldFacts.materials" @input="markDraftDirty()" maxlength="1500" class="border rounded p-2 w-full" placeholder="如实填写已核对的标识、单据或现场确认信息"></textarea></label><label class="block my-2">核实结论与待办<textarea x-model="fieldFacts.verification" @input="markDraftDirty()" maxlength="1500" class="border rounded p-2 w-full" placeholder="尚不能确认的事项，写明待谁核实"></textarea></label>
<details class="my-3"><summary>AI 建议的事实来源与待核实项</summary><template x-for="photo in allPhotos().filter(p=>p._analyzed)" :key="photo.id"><div class="border rounded p-3 my-2"><b x-text="photo.title"></b><p class="text-xs" x-text="'来源：AI 建议 · '+(photo.aiSource?.model||'历史识别')"></p><p class="text-sm" x-text="(photo.uncertainties||[]).join('；')"></p><label><input type="checkbox" x-model="photo.aiConfirmed" @change="markDraftDirty()"> 已逐项核对照片与文字</label></div></template><button @click="confirmAllAI()" class="border rounded p-2">我已核对全部 AI 建议</button></details>
<label class="block my-3"><input type="checkbox" x-model="customerTimeline" @change="markDraftDirty()"> 允许客户在公开分享中查看本工程其他同样授权公开的阶段版本</label>
<button @click="projectAction(()=>saveCloudProject())" :disabled="cloudBusy" class="border rounded p-2">保存补录到云端</button>
<h3 class="font-bold mt-6">问题整改与复核</h3><p class="text-sm text-slate-500 my-2">关键问题未复核关闭时不能通过项目审核。关键问题的整改与复核必须由不同人员完成。</p>
<div class="grid gap-2 border rounded p-3"><input x-model="issueForm.title" placeholder="问题简述" class="border rounded p-2"><div class="flex gap-2"><select x-model="issueForm.severity" aria-label="问题级别" class="border rounded p-2"><option value="normal">一般问题</option><option value="critical">关键问题</option></select><select x-model="issueForm.assignee" aria-label="整改负责人" class="border rounded p-2"><option value="">本人负责</option><template x-for="person in colleagues" :key="person.id"><option :value="person.id" x-text="person.display_name"></option></template></select></div><textarea x-model="issueForm.note" placeholder="问题位置与现场说明" class="border rounded p-2"></textarea><select x-model="issueForm.media" aria-label="问题留底照片" class="border rounded p-2"><option value="">选择已同步照片（可选）</option><template x-for="photo in allPhotos().filter(p=>p.mediaId)" :key="photo.id"><option :value="photo.mediaId" x-text="photo.title"></option></template></select><button @click="createIssue()" class="border rounded p-2">登记整改问题</button></div>
<template x-for="issue in issueItems" :key="issue.id"><div class="border rounded p-3 my-3"><b x-text="issue.title"></b><p class="text-sm" x-text="issue.assignee_name+' · '+(issue.severity==='critical'?'关键问题':'一般问题')+' · '+({open:'待整改',resolved:'待复核',closed:'已关闭'}[issue.status])"></p><template x-for="event in issue.events" :key="event.id"><p class="text-xs my-2" x-text="event.display_name+' · '+({create:'登记',resolve:'提交整改',close:'复核关闭',reopen:'重新打开'}[event.action])+'：'+event.note+' · 留底照片 '+event.media.length+' 张'"></p></template><input x-model="issueNotes[issue.id]" placeholder="整改或复核说明" class="border rounded p-2 w-full"><select x-model="issuePhotos[issue.id]" class="border rounded p-2 my-2"><option value="">选择整改照片</option><template x-for="photo in allPhotos().filter(p=>p.mediaId)" :key="photo.id"><option :value="photo.mediaId" x-text="photo.title"></option></template></select><div class="flex gap-2"><button x-show="issue.status==='open'" @click="changeIssue(issue,'resolve')" class="border rounded p-2">提交整改结果</button><button x-show="issue.status==='resolved'" @click="changeIssue(issue,'close')" class="border rounded p-2">复核关闭</button><button x-show="issue.status!=='open'" @click="changeIssue(issue,'reopen')" class="border rounded p-2">重新打开问题</button></div></div></template>
<h3 class="font-bold mt-6">公司培训案例</h3><p class="text-sm text-slate-500 my-2">只收录人工编写的脱敏文字，不复制客户项目名、房号或照片。另一位管理员审核通过后，公司账号可查阅。</p><div class="grid gap-2"><input x-model="caseForm.title" placeholder="脱敏案例标题" class="border rounded p-2"><textarea x-model="caseForm.problem" placeholder="通用问题与判断依据" class="border rounded p-2"></textarea><textarea x-model="caseForm.resolution" placeholder="处理方法与复核要点" class="border rounded p-2"></textarea><label><input type="checkbox" x-model="caseForm.redacted"> 已移除姓名、地址、联系方式等客户资料</label><button @click="submitCase()" class="border rounded p-2">提交培训案例审核</button></div><input x-show="accountUser?.role==='admin'" x-model="caseNote" placeholder="案例审核意见" class="border rounded p-2 my-3 w-full"><template x-for="item in caseItems" :key="item.id"><div class="border rounded p-3 my-2"><b x-text="item.title"></b><span class="text-xs ml-2" x-text="{pending:'待审核',approved:'已通过',rejected:'已退回',withdrawn:'已撤回'}[item.status]"></span><p class="whitespace-pre-wrap my-2" x-text="item.problem"></p><p class="whitespace-pre-wrap my-2" x-text="item.resolution"></p><p class="text-xs" x-text="item.review_note"></p><div class="flex gap-2"><button x-show="accountUser?.role==='admin'&&item.status==='pending'" @click="reviewCase(item,'approve')" class="border rounded p-2">通过案例</button><button x-show="accountUser?.role==='admin'&&item.status==='pending'" @click="reviewCase(item,'reject')" class="border rounded p-2">退回案例</button><button x-show="item.status!=='withdrawn'" @click="reviewCase(item,'withdraw')" class="border rounded p-2">撤回案例</button></div></div></template>
</div></div>
