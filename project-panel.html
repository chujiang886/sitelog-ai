  <div x-show="projectPanel" x-cloak class="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4" role="dialog" aria-label="项目工作区">
    <div class="bg-white rounded-xl p-6 w-full max-w-4xl max-h-[90vh] overflow-auto" @click.stop>
      <div class="flex justify-between items-center"><h2 class="text-xl font-bold">项目工作区</h2><button @click="projectPanel=false" aria-label="关闭项目工作区" class="text-2xl">×</button></div>
      <div class="flex flex-wrap gap-2 my-4"><input x-model="projectQuery" placeholder="搜索项目名称或阶段" class="border rounded p-2"><button @click="projectPage=1;projectAction(()=>loadProjects())" class="border rounded p-2">搜索工程</button><button @click="newLocalProject()" class="border rounded p-2">新建空白工程</button></div>
      <div class="grid gap-2"><template x-for="item in projectItems" :key="item.id"><button @click="openCloudProject(item.id)" class="border rounded p-3 text-left hover:bg-slate-50"><b x-text="item.title"></b><span class="ml-2 text-sm text-slate-500" x-text="item.stage+' · '+statusLabel(item.status)+' · 修订 '+item.revision"></span></button></template><p x-show="!projectItems.length" class="text-slate-500">尚无可访问工程。编辑后点击“保存云端工程”即可建立。</p></div>
      <div class="flex gap-3 my-3"><button :disabled="projectPage<=1" @click="projectPage--;projectAction(()=>loadProjects())">上一页</button><span x-text="projectPage+' / '+Math.max(1,Math.ceil(projectTotal/20))"></span><button :disabled="projectPage*20>=projectTotal" @click="projectPage++;projectAction(()=>loadProjects())">下一页</button></div>
      <details class="my-3"><summary>本机保存的工程草稿</summary><template x-for="draft in localDraftItems" :key="draft.key"><button @click="projectAction(()=>openLocalDraft(draft.key))" class="block border rounded p-2 my-2 w-full text-left" x-text="draft.title+' · '+draft.savedAt"></button></template><p class="text-xs text-slate-500">本机草稿按账号和工程隔离，仅在此浏览器可见。其他设备请使用云端工程或工程包。</p></details>
      <section x-show="cloudProjectId" class="border-t mt-5 pt-4">
        <h3 class="font-bold" x-text="'当前工程：'+projectName+' · '+statusLabel(cloudStatus)"></h3>
        <p class="text-sm text-slate-500 my-2">提交审核会保存当前内容。负责人可自行审核；多人复核可添加“审核人”。审核后再修改，需重新提交。</p>
        <label class="block my-2">审核备注<input x-model="reviewNote" placeholder="退回时必须说明原因" class="border rounded p-2 ml-2"></label>
        <div class="flex gap-2"><button @click="reviewProject('submit')" :disabled="cloudBusy" class="border rounded p-2">提交审核</button><button @click="reviewProject('approve')" :disabled="cloudStatus!=='review'" class="border rounded p-2">审核通过</button><button @click="reviewProject('reject')" :disabled="cloudStatus!=='review'" class="border rounded p-2">退回修改</button><button @click="projectPanel=false;openShareDialog()" class="border rounded p-2">发布分享码</button></div>
        <details class="my-4"><summary>项目成员与审核记录</summary><div class="flex flex-wrap gap-2 my-3"><select aria-label="项目成员" x-model="memberUser" class="border rounded p-2"><option value="">选择员工</option><template x-for="person in colleagues" :key="person.id"><option :value="person.id" x-text="person.display_name"></option></template></select><select aria-label="项目成员权限" x-model="memberRole" class="border rounded p-2"><option value="editor">编辑人</option><option value="reviewer">审核人</option><option value="viewer">只读成员</option><option value="remove">移除成员</option></select><button @click="updateProjectMember()" class="border rounded p-2">更新成员权限</button></div><template x-for="member in projectDetail?.members||[]" :key="member.user_id"><p x-text="member.display_name+' · '+({editor:'编辑人',reviewer:'审核人',viewer:'只读成员'}[member.role])"></p></template><template x-for="(review,i) in projectDetail?.reviews||[]" :key="i"><p class="text-sm my-1" x-text="review.display_name+' · 修订 '+review.revision+' · '+({submit:'提交',approve:'通过',reject:'退回'}[review.decision])+' '+review.note"></p></template></details>
        <h3 class="font-bold my-2">已发布版本</h3><template x-for="version in projectDetail?.versions||[]" :key="version.id"><div class="border rounded p-3 my-2 flex flex-wrap gap-3 items-center"><span x-text="'第 '+version.number+' 版 · 修订 '+version.revision+' · '+({public:'持链接可查看',internal:'公司内部',code:'访问码'}[version.audience])"></span><a :href="'/s/'+version.share_id" target="_blank" rel="noopener" class="underline">查看档案</a><button @click="changePublication(version.share_id,!version.revoked)" x-text="version.revoked?'恢复分享':'撤回分享'" class="border rounded p-1"></button><span class="text-xs" x-text="version.expires?'有效至 '+new Date(version.expires*1000).toLocaleDateString('zh-CN'):'长期有效'"></span></div></template>
      </section>
      <p class="text-sm text-amber-800 mt-4" x-text="cloudMessage"></p>
    </div>
  </div>
